services:
  - type: web
    name: orlina-backend
    runtime: node
    plan: free
    rootDir: backend
    branch: backend-setup
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_BANK_ID
        value: anvaya-memory
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
